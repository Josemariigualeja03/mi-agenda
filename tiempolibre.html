<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tiempo Libre</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e8eaf0;font-size:14px;min-height:100vh}
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1e2235;
  --border:#2a2f45;--border2:#3a4060;
  --text:#e8eaf0;--text2:#9aa0b8;--text3:#5a6080;
  --c-anime:#a78bfa;--c-anime-bg:rgba(167,139,250,.15);--c-anime-t:#c4b5fd;
  --c-manga:#f472b6;--c-manga-bg:rgba(244,114,182,.15);--c-manga-t:#f9a8d4;
  --c-libro:#fb923c;--c-libro-bg:rgba(251,146,60,.15);--c-libro-t:#fdba74;
  --c-pelicula:#facc15;--c-pelicula-bg:rgba(250,204,21,.15);--c-pelicula-t:#fde047;
  --c-serie:#22d3ee;--c-serie-bg:rgba(34,211,238,.15);--c-serie-t:#67e8f9;
  --c-ok:#22c55e;--c-ok-bg:rgba(34,197,94,.15);--c-ok-t:#86efac;
  --c-danger:#ef4444;--radius:8px;--radius-lg:12px;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 36px;text-align:center;max-width:360px;width:100%}
.login-title{font-size:28px;font-weight:700;background:linear-gradient(135deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.login-sub{font-size:14px;color:var(--text3);margin-bottom:28px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 20px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .15s}
.btn-google:hover{background:var(--border);border-color:var(--border2)}
.btn-google img{width:20px;height:20px}

#app-screen{display:none}
.app{max-width:1100px;margin:0 auto;padding:24px}

.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.app-title{font-size:22px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.user-row{display:flex;align-items:center;gap:8px}
.user-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover}
.user-name{font-size:13px;color:var(--text2)}
.btn-logout{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:3px;font-family:inherit}
.btn-logout:hover{color:var(--c-danger)}

/* Panel "Hoy" */
.today-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:20px}
.today-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.today-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.today-date{font-size:12px;color:var(--text3);text-transform:capitalize}
.today-list{display:flex;flex-direction:column;gap:6px}
.today-item{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px}
.today-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.today-icon.k-anime{background:var(--c-anime-bg);color:var(--c-anime-t)}
.today-icon.k-manga{background:var(--c-manga-bg);color:var(--c-manga-t)}
.today-icon.k-libro{background:var(--c-libro-bg);color:var(--c-libro-t)}
.today-icon.k-pelicula{background:var(--c-pelicula-bg);color:var(--c-pelicula-t)}
.today-icon.k-serie{background:var(--c-serie-bg);color:var(--c-serie-t)}
.today-text{flex:1;min-width:0}
.today-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-detail{font-size:12px;color:var(--text2)}
.today-count{font-size:11px;font-weight:700;color:var(--c-ok-t);background:var(--c-ok-bg);border-radius:99px;padding:2px 8px;white-space:nowrap}
.today-empty{font-size:12px;color:var(--text3);padding:6px 0}

.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab-btn{background:none;border:none;padding:10px 16px;cursor:pointer;color:var(--text3);font-size:14px;font-weight:600;font-family:inherit;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s}
.tab-btn:hover{color:var(--text2)}
.tab-btn.active{color:var(--text)}
.tab-btn.active.t-anime{border-color:var(--c-anime);color:var(--c-anime-t)}
.tab-btn.active.t-manga{border-color:var(--c-manga);color:var(--c-manga-t)}
.tab-btn.active.t-libro{border-color:var(--c-libro);color:var(--c-libro-t)}
.tab-btn.active.t-pelicula{border-color:var(--c-pelicula);color:var(--c-pelicula-t)}
.tab-btn.active.t-serie{border-color:var(--c-serie);color:var(--c-serie-t)}

.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-chip{background:var(--bg3);border:1px solid var(--border);border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--text2);font-size:12px;font-family:inherit;transition:all .15s}
.filter-chip:hover{border-color:var(--border2)}
.filter-chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.step-picker{display:flex;align-items:center;gap:6px;margin-bottom:14px;font-size:12px;color:var(--text3)}
.btn-primary{border:none;border-radius:var(--radius);padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;font-family:inherit;transition:opacity .15s;color:#fff}
.btn-primary:hover{opacity:.85}
.btn-primary.b-anime{background:var(--c-anime)}
.btn-primary.b-manga{background:var(--c-manga)}
.btn-primary.b-libro{background:var(--c-libro)}
.btn-primary.b-pelicula{background:var(--c-pelicula);color:#1a1a1a}
.btn-primary.b-serie{background:var(--c-serie);color:#1a1a1a}

.search-box{position:relative;flex:1;max-width:260px;min-width:160px}
.search-box input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px 7px 32px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--border2)}
.search-box i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.search-box .clear-search{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;display:none}
.search-box.has-text .clear-search{display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:border-color .15s;position:relative;display:flex;flex-direction:column}
.card:hover{border-color:var(--border2)}
.card-cover{width:100%;aspect-ratio:2/3;background:var(--bg3);object-fit:cover;display:block}
.card-cover-placeholder{width:100%;aspect-ratio:2/3;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:32px}
.card-body{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:6px}
.card-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-block;width:fit-content;text-transform:uppercase;letter-spacing:.03em}
.status-viendo{background:var(--c-anime-bg);color:var(--c-anime-t)}
.status-pendiente{background:rgba(154,160,184,.15);color:var(--text2)}
.status-terminado{background:var(--c-ok-bg);color:var(--c-ok-t)}
.progress-row{display:flex;align-items:center;gap:6px;margin-top:auto}
.progress-bar-bg{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:3px;transition:width .2s}
.progress-text{font-size:11px;color:var(--text3);white-space:nowrap}
.card-actions{display:flex;gap:4px;position:absolute;top:6px;right:6px;opacity:0;transition:opacity .15s}
.card:hover .card-actions{opacity:1}
.card-act-btn{background:rgba(15,17,23,.85);border:none;border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:14px}
.card-act-btn:hover{color:#fff}
.rating-badge{position:absolute;top:6px;left:6px;background:rgba(15,17,23,.85);border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700;color:#fcd34d;display:flex;align-items:center;gap:2px}
.step-row{display:flex;align-items:center;gap:4px}
.step-btn{width:20px;height:20px;border-radius:5px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1}
.step-btn:hover{background:var(--border);color:var(--text)}

.empty-state{text-align:center;color:var(--text3);padding:60px 0;font-size:13px}
.empty-state i{font-size:36px;display:block;margin-bottom:10px;opacity:.4}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius-lg);border:1px solid var(--border2);padding:22px;width:420px;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)}
.form-group{margin-bottom:11px}
.form-group label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--border2)}
.form-group textarea{resize:vertical;min-height:60px}
.form-group select option{background:var(--bg2)}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.cover-preview{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cover-preview img{width:50px;height:70px;object-fit:cover;border-radius:6px;background:var(--bg3)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-cancel{padding:7px 16px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
.btn-cancel:hover{background:var(--bg3);color:var(--text)}
.btn-save{padding:7px 18px;border-radius:var(--radius);border:none;color:#fff;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:opacity .15s}
.btn-save:hover{opacity:.85}
.stars-input{display:flex;gap:4px;font-size:20px;cursor:pointer}
.stars-input i{color:var(--border2)}
.stars-input i.filled{color:#fcd34d}
.empty-hint{font-size:12px;color:var(--text3);text-align:center;padding:30px 0}

.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 16px;font-size:13px;color:var(--text);z-index:300;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:400;flex-direction:column;gap:12px}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--c-anime);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text3);font-size:13px}

@media(max-width:600px){
  .app{padding:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="loading-spinner"></div><p>Cargando...</p></div>

<div id="login-screen" style="display:none">
  <div class="login-card">
    <div class="login-title">Mi Tiempo Libre</div>
    <div class="login-sub">Inicia sesión para acceder a tu lista de anime, manga, libros, películas y series</div>
    <button class="btn-google" onclick="loginGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Continuar con Google
    </button>
  </div>
</div>

<div id="app-screen">
<div class="app">
  <div class="top-bar">
    <span class="app-title">Mi Tiempo Libre</span>
    <div class="user-row">
      <img class="user-avatar" id="user-avatar" src="" alt="">
      <span class="user-name" id="user-name"></span>
      <button class="btn-logout" onclick="logout()" title="Cerrar sesión"><i class="ti ti-logout"></i></button>
    </div>
  </div>

  <!-- Lo que has visto/leído hoy -->
  <div class="today-panel" id="today-panel"></div>

  <div class="tabs">
    <button class="tab-btn t-anime" onclick="switchTab('anime')" id="tabbtn-anime"><i class="ti ti-eye"></i> Anime</button>
    <button class="tab-btn t-manga" onclick="switchTab('manga')" id="tabbtn-manga"><i class="ti ti-book"></i> Manga</button>
    <button class="tab-btn t-libro" onclick="switchTab('libro')" id="tabbtn-libro"><i class="ti ti-book-2"></i> Libros</button>
    <button class="tab-btn t-pelicula" onclick="switchTab('pelicula')" id="tabbtn-pelicula"><i class="ti ti-movie"></i> Películas</button>
    <button class="tab-btn t-serie" onclick="switchTab('serie')" id="tabbtn-serie"><i class="ti ti-device-tv"></i> Series</button>
  </div>

  <div id="tab-content"></div>
</div>
</div>

<!-- Modal anime/manga/libro/película/serie -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modal-title">Añadir anime</h2>
    <div class="cover-preview" id="cover-preview" style="display:none">
      <img id="cover-img" src="" alt="">
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--text)" id="cover-title">Vista previa</div>
        <button class="btn-cancel" style="margin-top:4px;padding:3px 8px;font-size:11px" onclick="clearCover()">Quitar portada</button>
      </div>
    </div>
    <div class="form-group">
      <label>Título</label>
      <input type="text" id="f-titulo" placeholder="Nombre del título">
    </div>
    <div class="form-group">
      <label>URL de la portada (opcional)</label>
      <input type="text" id="f-cover-url" placeholder="Pega aquí el enlace de una imagen..." oninput="onCoverUrlInput()">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Estado</label>
        <select id="f-estado">
          <option value="viendo">Viendo / Leyendo</option>
          <option value="pendiente">Pendiente</option>
          <option value="terminado">Terminado</option>
        </select>
      </div>
      <div class="form-group">
        <label id="f-progreso-label">Episodios</label>
        <div class="form-row" style="gap:4px">
          <input type="number" id="f-actual" min="0" value="0" style="width:60px">
          <span style="align-self:center;color:var(--text3)">/</span>
          <input type="number" id="f-total" min="0" placeholder="Total" style="width:70px">
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Valoración</label>
      <div class="stars-input" id="stars-input"></div>
    </div>
    <div class="form-group">
      <label>Notas (opcional)</label>
      <textarea id="f-notas" placeholder="Tus impresiones..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" id="btn-save" onclick="saveTitulo()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc, updateDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBY8pUuRWPngTNy7ica_kIPPn16Y_oFRvs",
  authDomain: "mi-agenda-personal-1e740.firebaseapp.com",
  projectId: "mi-agenda-personal-1e740",
  storageBucket: "mi-agenda-personal-1e740.firebasestorage.app",
  messagingSenderId: "412139173597",
  appId: "1:412139173597:web:78d90392260f1e7864cd34"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let activeTab = 'anime';
let activeFilter = 'todos';
let searchQuery = { anime:'', manga:'', libro:'', pelicula:'', serie:'' };
let animeList = [], mangaList = [], libroList = [], peliculaList = [], serieList = [], activityList = [];
let unsubAnime=null, unsubManga=null, unsubLibro=null, unsubPelicula=null, unsubSerie=null, unsubActivity=null;
let editId = null, currentRating = 0, selectedCover = null;

// Incremento elegido para los botones +/- del manga (0.01, 0.1 o 1)
let mangaStep = 0.01;

// Configuracion por tipo de lista (anime, manga, libro, pelicula, serie)
// unidad / unidadPlural: como se muestra en el panel "Hoy" (ej. "Cap. 100", "Ep. 5")
const LIST_TYPES = {
  anime:    { col:'anime',    label:'anime',    labelCap:'Anime',     progresoLabel:'Episodios',  estadoViendo:'Viendo',  icon:'eye',      emptyIcon:'eye-off', step:1,    unidad:'Ep.',  unidadPlural:'Eps.' },
  manga:    { col:'manga',    label:'manga',    labelCap:'Manga',     progresoLabel:'Capítulos',  estadoViendo:'Leyendo', icon:'book',     emptyIcon:'book-off', step:0.01, unidad:'Cap.', unidadPlural:'Caps.' },
  libro:    { col:'libros',   label:'libro',    labelCap:'Libro',     progresoLabel:'Páginas',    estadoViendo:'Leyendo', icon:'book-2',   emptyIcon:'book-off', step:1,    unidad:'Pág.', unidadPlural:'Págs.' },
  pelicula: { col:'peliculas',label:'película', labelCap:'Película',  progresoLabel:'Minutos',    estadoViendo:'Viendo',  icon:'movie',    emptyIcon:'movie-off', step:1,   unidad:'Min.', unidadPlural:'Mins.' },
  serie:    { col:'series',   label:'serie',    labelCap:'Serie',     progresoLabel:'Episodios',  estadoViendo:'Viendo',  icon:'device-tv',emptyIcon:'movie-off', step:1,   unidad:'Ep.',  unidadPlural:'Eps.' }
};
// Incremento que usan los botones +/- (en manga lo elige el usuario)
function stepOf(type){ return type==='manga' ? mangaStep : LIST_TYPES[type].step; }
function listOf(type){
  if(type==='anime') return animeList;
  if(type==='manga') return mangaList;
  if(type==='libro') return libroList;
  if(type==='pelicula') return peliculaList;
  if(type==='serie') return serieList;
  return [];
}

// Redondea a 2 decimales evitando errores de coma flotante (ej. 12.1 + 0.01 -> 12.109999...)
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
// Parsea el numero de progreso segun el step del tipo (entero para step=1, decimal con 2 cifras para step<1)
function parseProgreso(val, step){
  const n = parseFloat(val);
  if(isNaN(n)) return null;
  return step < 1 ? round2(n) : Math.trunc(n);
}
// Formatea un numero de progreso para mostrarlo (sin ceros decimales sobrantes)
function formatProgreso(n, step){
  if(n===null || n===undefined) return '';
  if(step < 1){
    return round2(n).toString();
  }
  return String(n);
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

window.loginGoogle = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ showToast('Error al iniciar sesión'); }
};
window.logout = async () => {
  [unsubAnime,unsubManga,unsubLibro,unsubPelicula,unsubSerie,unsubActivity].forEach(u=>u&&u());
  await signOut(auth);
};

onAuthStateChanged(auth, user => {
  document.getElementById('loading').style.display = 'none';
  if(user){
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('user-name').textContent = user.displayName || user.email;
    document.getElementById('user-avatar').src = user.photoURL || '';
    subscribeData();
    renderToday();
    switchTab('anime');
  } else {
    currentUser = null;
    animeList=[]; mangaList=[]; libroList=[]; peliculaList=[]; serieList=[]; activityList=[];
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }
});

function userCol(col){ return collection(db, 'users', currentUser.uid, col); }
function userDoc(col, id){ return doc(db, 'users', currentUser.uid, col, id); }

function subscribeData(){
  [unsubAnime,unsubManga,unsubLibro,unsubPelicula,unsubSerie,unsubActivity].forEach(u=>u&&u());
  unsubAnime = onSnapshot(userCol('anime'), snap => {
    animeList = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(activeTab==='anime') renderTab();
  });
  unsubManga = onSnapshot(userCol('manga'), snap => {
    mangaList = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(activeTab==='manga') renderTab();
  });
  unsubLibro = onSnapshot(userCol('libros'), snap => {
    libroList = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(activeTab==='libro') renderTab();
  });
  unsubPelicula = onSnapshot(userCol('peliculas'), snap => {
    peliculaList = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(activeTab==='pelicula') renderTab();
  });
  unsubSerie = onSnapshot(userCol('series'), snap => {
    serieList = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(activeTab==='serie') renderTab();
  });
  // Registro diario: un documento por (dia + tipo + titulo)
  unsubActivity = onSnapshot(userCol('actividad'), snap => {
    activityList = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderToday();
  });
}

// ================== PANEL "HOY" ==================
function todayKey(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function renderToday(){
  const panel = document.getElementById('today-panel');
  if(!panel) return;
  const hoy = todayKey();
  const items = activityList
    .filter(a=>a.fecha===hoy && LIST_TYPES[a.type])
    .sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  const fechaTxt = new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});

  const rows = items.map(a=>{
    const cfg = LIST_TYPES[a.type];
    const diff = round2(a.hasta - a.desde);
    const unica = diff <= cfg.step + 1e-9;
    const detalle = unica
      ? `${cfg.unidad} ${formatProgreso(a.hasta, cfg.step)}`
      : `${cfg.unidadPlural} ${formatProgreso(a.desde, cfg.step)} → ${formatProgreso(a.hasta, cfg.step)}`;
    const cuenta = unica ? '' : `<span class="today-count">+${formatProgreso(diff, cfg.step)}</span>`;
    return `
    <div class="today-item">
      <div class="today-icon k-${a.type}"><i class="ti ti-${cfg.icon}"></i></div>
      <div class="today-text">
        <div class="today-name">${esc(a.titulo)}</div>
        <div class="today-detail">${detalle}</div>
      </div>
      ${cuenta}
    </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="today-head">
      <span class="today-title"><i class="ti ti-calendar-event"></i> Hoy</span>
      <span class="today-date">${fechaTxt}</span>
    </div>
    ${items.length
      ? `<div class="today-list">${rows}</div>`
      : `<div class="today-empty">Todavía no has registrado nada hoy. Pulsa + en cualquier título al terminar un capítulo o episodio.</div>`}
  `;
}

// Registra el avance del dia para un titulo (desde el primer + del dia hasta el valor actual)
async function logActivity(type, it, oldActual, newActual){
  if(oldActual === newActual) return;
  const fecha = todayKey();
  const id = `${fecha}_${type}_${it.id}`;
  const prev = activityList.find(a=>a.id===id);
  let desde = prev ? prev.desde : oldActual;
  const hasta = newActual;
  if(hasta < desde) desde = hasta;
  if(hasta === desde){
    if(prev) await deleteDoc(userDoc('actividad', id));
    return;
  }
  await setDoc(userDoc('actividad', id), {
    fecha, type, itemId: it.id, titulo: it.titulo,
    desde, hasta, updatedAt: new Date().toISOString()
  });
}

window.switchTab = (tab) => {
  activeTab = tab; activeFilter = 'todos';
  ['anime','manga','libro','pelicula','serie'].forEach(t=>{
    document.getElementById('tabbtn-'+t).classList.toggle('active', t===tab);
  });
  renderToday();
  renderTab();
};

function renderTab(){
  const content = document.getElementById('tab-content');
  renderListTab(content, activeTab);
}

// ================== ANIME / MANGA / LIBRO / PELICULA / SERIE (listas genericas) ==================
function renderListTab(content, type){
  const cfg = LIST_TYPES[type];
  const list = listOf(type);
  const q = searchQuery[type].toLowerCase().trim();
  let filtered = activeFilter==='todos' ? list : list.filter(it=>it.estado===activeFilter);
  if(q) filtered = filtered.filter(it=>it.titulo.toLowerCase().includes(q));

  const counts = {
    todos: list.length,
    viendo: list.filter(i=>i.estado==='viendo').length,
    pendiente: list.filter(i=>i.estado==='pendiente').length,
    terminado: list.filter(i=>i.estado==='terminado').length
  };

  content.innerHTML = `
    <div class="toolbar">
      <div class="filter-row">
        <div class="search-box" id="search-box-${type}">
          <i class="ti ti-search"></i>
          <input type="text" id="search-input-${type}" placeholder="Buscar en ${cfg.label}..." value="${esc(searchQuery[type])}" oninput="onSearchType('${type}', this.value)">
          <button class="clear-search" onclick="clearSearchType('${type}')"><i class="ti ti-x"></i></button>
        </div>
        <button class="filter-chip ${activeFilter==='todos'?'active':''}" onclick="setFilter('todos')">Todos (${counts.todos})</button>
        <button class="filter-chip ${activeFilter==='viendo'?'active':''}" onclick="setFilter('viendo')">${cfg.estadoViendo} (${counts.viendo})</button>
        <button class="filter-chip ${activeFilter==='pendiente'?'active':''}" onclick="setFilter('pendiente')">Pendiente (${counts.pendiente})</button>
        <button class="filter-chip ${activeFilter==='terminado'?'active':''}" onclick="setFilter('terminado')">Terminado (${counts.terminado})</button>
      </div>
      <button class="btn-primary b-${type}" onclick="openModal('${type}')"><i class="ti ti-plus"></i> Añadir</button>
    </div>
    ${type==='manga' ? `
    <div class="step-picker">
      <span>Sumar de:</span>
      ${[0.01,0.1,1].map(s=>`<button class="filter-chip ${mangaStep===s?'active':''}" onclick="setMangaStep(${s})">${s}</button>`).join('')}
    </div>` : ''}
    <div class="grid" id="items-grid"></div>
  `;
  if(q) document.getElementById('search-box-'+type).classList.add('has-text');

  const grid = document.getElementById('items-grid');
  if(!filtered.length){
    grid.outerHTML = `<div class="empty-state"><i class="ti ti-${cfg.emptyIcon}"></i>${q?'Sin resultados para "'+esc(q)+'"':'Nada por aquí todavía'}<br><small style="margin-top:6px;display:block">${q?'Prueba otra búsqueda':'Pulsa "Añadir" para empezar tu lista'}</small></div>`;
    return;
  }

  grid.innerHTML = filtered.map(it=>{
    const pct = it.total ? Math.min(100, Math.round((it.actual/it.total)*100)) : 0;
    const barColor = `var(--c-${type})`;
    return `
    <div class="card">
      ${it.rating ? `<div class="rating-badge"><i class="ti ti-star" style="font-size:12px"></i>${it.rating}</div>` : ''}
      <div class="card-actions">
        <button class="card-act-btn" onclick="editTitulo('${type}','${it.id}')" aria-label="Editar"><i class="ti ti-edit"></i></button>
        <button class="card-act-btn" onclick="deleteTitulo('${type}','${it.id}')" aria-label="Eliminar"><i class="ti ti-trash"></i></button>
      </div>
      ${it.cover ? `<img class="card-cover" src="${it.cover}" alt="${esc(it.titulo)}">` : `<div class="card-cover-placeholder"><i class="ti ti-${cfg.icon}"></i></div>`}
      <div class="card-body">
        <div class="card-title">${esc(it.titulo)}</div>
        <span class="card-status status-${it.estado}">${it.estado==='viendo'?cfg.estadoViendo:it.estado}</span>
        <div class="progress-row">
          <div class="step-row">
            <button class="step-btn" onclick="stepProgress('${type}','${it.id}',-1)" aria-label="Restar">−</button>
            <button class="step-btn" onclick="stepProgress('${type}','${it.id}',1)" aria-label="Sumar">+</button>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
          <span class="progress-text">${formatProgreso(it.actual||0, cfg.step)}${it.total?'/'+formatProgreso(it.total, cfg.step):''}</span>
        </div>
        ${it.total ? `<button class="step-btn" style="width:100%;margin-top:4px;font-size:10px;height:18px" onclick="incrementTotal('${type}','${it.id}')" title="Añadir más al total">+${formatProgreso(stepOf(type), cfg.step)} al total</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

window.onSearchType = (type, val) => {
  searchQuery[type] = val;
  document.getElementById('search-box-'+type)?.classList.toggle('has-text', !!val);
  renderTab();
  setTimeout(()=>{
    const inp = document.getElementById('search-input-'+type);
    if(inp){ inp.focus(); inp.setSelectionRange(val.length, val.length); }
  },0);
};
window.clearSearchType = (type) => { searchQuery[type]=''; renderTab(); };

window.setFilter = (f) => { activeFilter = f; renderTab(); };

window.setMangaStep = (s) => { mangaStep = s; renderTab(); };

window.onCoverUrlInput = () => {
  const url = document.getElementById('f-cover-url').value.trim();
  if(!url){ document.getElementById('cover-preview').style.display='none'; selectedCover=null; return; }
  selectedCover = url;
  document.getElementById('cover-img').src = url;
  document.getElementById('cover-preview').style.display = 'flex';
};
window.clearCover = () => {
  selectedCover = null;
  document.getElementById('f-cover-url').value = '';
  document.getElementById('cover-preview').style.display = 'none';
};

let currentModalType = 'anime';
window.openModal = (type) => {
  currentModalType = type; editId = null; selectedCover = null; currentRating = 0;
  const cfg = LIST_TYPES[type];
  document.getElementById('modal-title').textContent = 'Añadir ' + cfg.label;
  document.getElementById('f-progreso-label').textContent = cfg.progresoLabel;
  document.getElementById('f-cover-url').value='';
  document.getElementById('cover-preview').style.display='none';
  document.getElementById('f-titulo').value='';
  document.getElementById('f-estado').value='pendiente';
  const fActual = document.getElementById('f-actual');
  const fTotal = document.getElementById('f-total');
  fActual.step = cfg.step; fTotal.step = cfg.step;
  fActual.value = 0;
  fTotal.value = '';
  document.getElementById('f-notas').value='';
  renderStars();
  document.getElementById('modal-bg').classList.add('open');
};
window.closeModal = () => document.getElementById('modal-bg').classList.remove('open');

function renderStars(){
  const el = document.getElementById('stars-input');
  el.innerHTML = [1,2,3,4,5].map(n=>`<i class="ti ti-star${n<=currentRating?' filled':''}" data-n="${n}" onclick="setRating(${n})"></i>`).join('');
}
window.setRating = (n) => { currentRating = (currentRating===n) ? 0 : n; renderStars(); };

window.editTitulo = (type, id) => {
  const list = listOf(type);
  const it = list.find(x=>x.id===id);
  if(!it) return;
  currentModalType = type; editId = id; selectedCover = it.cover || null; currentRating = it.rating || 0;
  const cfg = LIST_TYPES[type];
  document.getElementById('modal-title').textContent = 'Editar';
  document.getElementById('f-progreso-label').textContent = cfg.progresoLabel;
  document.getElementById('f-cover-url').value = it.cover || '';
  if(it.cover){
    document.getElementById('cover-img').src = it.cover;
    document.getElementById('cover-preview').style.display='flex';
  } else {
    document.getElementById('cover-preview').style.display='none';
  }
  document.getElementById('f-titulo').value = it.titulo;
  document.getElementById('f-estado').value = it.estado;
  const fActual = document.getElementById('f-actual');
  const fTotal = document.getElementById('f-total');
  fActual.step = cfg.step; fTotal.step = cfg.step;
  fActual.value = formatProgreso(it.actual || 0, cfg.step);
  fTotal.value = it.total ? formatProgreso(it.total, cfg.step) : '';
  document.getElementById('f-notas').value = it.notas || '';
  renderStars();
  document.getElementById('modal-bg').classList.add('open');
};

window.saveTitulo = async () => {
  const titulo = document.getElementById('f-titulo').value.trim();
  if(!titulo){ document.getElementById('f-titulo').focus(); return; }
  const cfg = LIST_TYPES[currentModalType];
  const actualVal = document.getElementById('f-actual').value;
  const totalVal = document.getElementById('f-total').value;
  const data = {
    titulo,
    estado: document.getElementById('f-estado').value,
    actual: parseProgreso(actualVal, cfg.step) ?? 0,
    total: totalVal ? parseProgreso(totalVal, cfg.step) : null,
    rating: currentRating,
    notas: document.getElementById('f-notas').value.trim(),
    cover: selectedCover,
    updatedAt: new Date().toISOString()
  };
  const colName = cfg.col;
  if(editId) await updateDoc(userDoc(colName, editId), data);
  else await addDoc(userCol(colName), {...data, createdAt: new Date().toISOString()});
  closeModal();
  showToast(editId?'Actualizado':'Añadido ✓');
};

window.deleteTitulo = async (type, id) => {
  if(!confirm('¿Eliminar este título?')) return;
  await deleteDoc(userDoc(LIST_TYPES[type].col, id));
  showToast('Eliminado');
};

window.stepProgress = async (type, id, dir) => {
  const list = listOf(type);
  const it = list.find(x=>x.id===id);
  if(!it) return;
  const cfg = LIST_TYPES[type];
  const anterior = it.actual || 0;
  let actual = round2(anterior + dir*stepOf(type));
  if(cfg.step >= 1) actual = Math.trunc(actual);
  if(actual < 0) actual = 0;
  if(it.total && actual > it.total) actual = it.total;
  const updates = { actual };
  if(it.total && actual >= it.total) updates.estado = 'terminado';
  else if(actual > 0 && it.estado === 'pendiente') updates.estado = 'viendo';
  await updateDoc(userDoc(cfg.col, id), updates);
  await logActivity(type, it, anterior, actual);
};

window.incrementTotal = async (type, id) => {
  const list = listOf(type);
  const it = list.find(x=>x.id===id);
  if(!it || !it.total) return;
  const cfg = LIST_TYPES[type];
  let newTotal = round2(it.total + stepOf(type));
  if(cfg.step >= 1) newTotal = Math.trunc(newTotal);
  const updates = { total: newTotal };
  if(it.estado === 'terminado' && (it.actual||0) < newTotal) updates.estado = 'viendo';
  await updateDoc(userDoc(cfg.col, id), updates);
  showToast('Añadido al total ✓');
};

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); }
});
</script>
